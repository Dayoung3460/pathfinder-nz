services:
  - type: web
    name: pathfinder-nz-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CHROMA_DB_PATH
        value: ./data/chroma_db
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: REFRESH_SECRET
        sync: false

  - type: web
    name: pathfinder-nz-frontend
    runtime: docker
    dockerfilePath: frontend-react/Dockerfile
    dockerContext: .
    plan: free

  - type: cron
    name: pathfinder-nz-refresh
    runtime: docker
    dockerfilePath: Dockerfile.cron
    dockerContext: .
    schedule: "0 3 * * 1"
    envVars:
      - key: BACKEND_URL
        value: https://pathfinder-nz-backend.onrender.com
      - key: REFRESH_SECRET
        sync: false
